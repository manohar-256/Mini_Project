<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolicyGuard AI Chatbot</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
<link rel="stylesheet" href="chat.css">
</head>

<body>
    <div class="container">

        <header class="app-header">
            <h1 class="heading">Hello, Prathamesh</h1>
            <h2 class="sub-heading">How can I help you?</h2>
        </header>

        <ul class="suggestions">
            <li class="suggestions-item">
                <p class="text">What Does My Health Insurance Cover?</p>
                <span class="material-symbols-outlined">draw</span>
            </li>

            <li class="suggestions-item">
                <p class="text">How to File an Insurance Claim?</p>
                <i class="fa-solid fa-lightbulb"></i>
            </li>

            <li class="suggestions-item">
                <p class="text">Why Was My Claim Rejected?</p>
                <i class="fa-solid fa-compass"></i>
            </li>

            <li class="suggestions-item">
                <p class="text">What Is Premium in Insurance?</p>
                <i class="fa-solid fa-code"></i>
            </li>
        </ul>


        <div class="chats-container">
        </div>

        <div class="prompt-container">
            <div class="prompt-wrapper">

                <form action="#" class="prompt-form">
                    <input type="text" placeholder="Ask PolicyGuard AI" class="prompt-input" required>

                    <div class="prompt-actions">
                        <div class="file-upload-wrapper ">
                         <img src="#" class="file-preview">
   <input type="file" 
       accept="image/*, image/jpeg, image/png, .pdf, .txt, .csv" 
       id="file-input" 
       hidden>
 
                             
                        <button type="button" class="file-icon material-symbols-rounded">
                            description
                        </button>
                    
                        <button id="add-file-btn" type="button">
                            <i class="fa-solid fa-link"></i>
                        </button>

                           
                        <button id="cancel-file-btn" type="button">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
  </div>
                        <button type="button" id="stop-response-btn">
                            <i class="fa-regular fa-stop-circle"></i>
                        </button>


                          <button id="send-prompt-btn">
                            <i class="fa-solid fa-arrow-up"></i>
                        </button>
                    </div>
                </form>

              <button id="theme-toggle-btn" class="theme-btn">
    <span class="material-symbols-rounded">dark_mode</span>
</button>

                <button id="delete-chats-btn">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>

            <p class="disclaimer-text">PolicyGuard AI can make mistakes, so double-check it.</p>
        </div>

    </div>
    <script src="chat.js"></script>
</body>
</html>
